# PacMan settings for the SDN project. Paths are relative to the PROJECT folder
# (scripts/run_pacman.sh runs PacMan from there).
interface=mon0
reports_dir=results/pacman-reports
log_file=results/pacman.log
refresh_ms=400
queue_size=10000

# Detection: connections a host *starts*, counted in a sliding window
detection_window_s=10
# > N distinct ports opened on one host in the window -> PORT_SCAN (HIGH)
port_scan_threshold=15
# > N new connections from one host in the window -> HIGH_CONN (MEDIUM)
high_connection_threshold=40
# > N new TCP connections from one host in the window -> SYN_FLOOD (HIGH)
syn_flood_threshold=200
# one flow larger than this -> LARGE_TX (MEDIUM)
large_transfer_bytes=10485760

# Mitigation: HIGH alerts are written here for the POX controller (pacman_ips.py)
firewall_mode=sdn
blocklist_file=results/blocklist.txt
block_cooldown_s=30

# No VirusTotal lookups inside the lab network
virus_total_api_key=
